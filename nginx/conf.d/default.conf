map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

log_format sanitized '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;

    access_log /var/log/nginx/access.log sanitized;
    error_log /var/log/nginx/error.log;

    proxy_intercept_errors on;
    error_page 502 503 504 = @upstream_unavailable;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    location ~* /\.(env|git|aws|bak|old|sql)$ {
        deny all;
    }

    location = /jellyfin {
        return 302 /jellyfin/;
    }

    location ^~ /jellyfin/ {
        set $jellyfin_upstream http://jellyfin:8096;
        rewrite ^/jellyfin/(.*)$ /$1 break;
        proxy_pass $jellyfin_upstream;
    }

    location = /prowlarr {
        return 302 /prowlarr/;
    }

    location ^~ /prowlarr/ {
        set $prowlarr_upstream http://prowlarr:9696;
        proxy_pass $prowlarr_upstream;
    }

    location = /bazarr {
        return 302 /bazarr/;
    }

    location ^~ /bazarr/ {
        set $bazarr_upstream http://bazarr:6767;
        proxy_pass $bazarr_upstream;
    }

    location = /radarr {
        return 302 /radarr/;
    }

    location ^~ /radarr/ {
        set $radarr_upstream http://radarr:7878;
        proxy_pass $radarr_upstream;
    }

    location = /sonarr {
        return 302 /sonarr/;
    }

    location ^~ /sonarr/ {
        set $sonarr_upstream http://sonarr:8989;
        proxy_pass $sonarr_upstream;
    }

    location = /qbittorrent {
        return 302 /qbittorrent/;
    }

    location ^~ /qbittorrent/ {
        set $qbittorrent_upstream http://gluetun:8080;
        rewrite ^/qbittorrent/(.*)$ /$1 break;
        proxy_pass $qbittorrent_upstream;
    }

    location = /homepage {
        return 301 /;
    }

    location ^~ /homepage/ {
        return 301 /;
    }

    location ^~ /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    location / {
        set $homarr_upstream http://homarr:7575;
        client_max_body_size 100m;
        proxy_pass $homarr_upstream;
    }

    location @upstream_unavailable {
        default_type text/plain;
        return 503 "Service temporarily unavailable\n";
    }
}
