name: jellyfin-docker

networks:
  media:
    driver: bridge
  docker-api:
    driver: bridge
    internal: true

x-linuxserver-env: &linuxserver_env
  PUID: ${PUID:?Set PUID in .env}
  PGID: ${PGID:?Set PGID in .env}
  TZ: ${TZ:?Set TZ in .env}

x-service-dns: &service_dns
  - 1.1.1.1
  - 1.0.0.1

x-http-healthcheck: &http_healthcheck_defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 30s

x-logging: &default_logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    logging: *default_logging
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    environment:
      TZ: ${TZ:?Set TZ in .env}
      VPN_SERVICE_PROVIDER: mullvad
      VPN_TYPE: wireguard
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:?Set WIREGUARD_ADDRESSES in .env}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:?Set WIREGUARD_PRIVATE_KEY in .env}
      WIREGUARD_PUBLIC_KEY: ${WIREGUARD_PUBLIC_KEY:?Set WIREGUARD_PUBLIC_KEY in .env}
      WIREGUARD_ENDPOINT: ${WIREGUARD_ENDPOINT:?Set WIREGUARD_ENDPOINT in .env}
      WIREGUARD_ALLOWED_IPS: ${WIREGUARD_ALLOWED_IPS:?Set WIREGUARD_ALLOWED_IPS in .env}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-Sweden}
      DNS: 1.1.1.1
      HTTP_CONTROL_SERVER_ADDRESS: :8000
      HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH: /gluetun/auth/config.toml
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - media
    expose:
      - "8000"
    volumes:
      - ${COMMON_PATH:?Set COMMON_PATH in .env}/Gluetun/Auth/config.toml:/gluetun/auth/config.toml:ro

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent@sha256:6a7ffbfff04dd109bff37c474bfee00aa08dea5edb78c670439be3ed242b70fa
    container_name: qbittorrent
    logging: *default_logging
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped
    environment:
      <<: *linuxserver_env
      WEBUI_PORT: 8080
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080 || exit 1"]
      <<: *http_healthcheck_defaults
    volumes:
      - ${COMMON_PATH:?Set COMMON_PATH in .env}/Qbittorrent/Config:/config
      - ${COMMON_PATH:?Set COMMON_PATH in .env}/Data/downloads:/data/downloads

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    logging: *default_logging
    restart: unless-stopped
    networks:
      - media
    environment:
      <<: *linuxserver_env
      URL_BASE: /sonarr
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8989/sonarr || exit 1"]
      <<: *http_healthcheck_defaults
    volumes:
      - ${COMMON_PATH:?Set COMMON_PATH in .env}/Sonarr/Config:/config
      - ${COMMON_PATH:?Set COMMON_PATH in .env}/Data:/data

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    logging: *default_logging
    restart: unless-stopped
    networks:
      - media
    environment:
      <<: *linuxserver_env
      URL_BASE: /radarr
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7878/radarr || exit 1"]
      <<: *http_healthcheck_defaults
    volumes:
      - ${COMMON_PATH:?Set COMMON_PATH in .env}/Radarr/Config:/config
      - ${COMMON_PATH:?Set COMMON_PATH in .env}/Data:/data

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    logging: *default_logging
    restart: unless-stopped
    networks:
      - media
    dns: *service_dns
    environment:
      <<: *linuxserver_env
      URL_BASE: /prowlarr
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9696/prowlarr || exit 1"]
      <<: *http_healthcheck_defaults
    volumes:
      - ${COMMON_PATH:?Set COMMON_PATH in .env}/Prowlarr/Config:/config

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    logging: *default_logging
    restart: unless-stopped
    networks:
      - media
    environment:
      <<: *linuxserver_env
      URL_BASE: /bazarr
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:6767/bazarr || exit 1"]
      <<: *http_healthcheck_defaults
    volumes:
      - ${COMMON_PATH:?Set COMMON_PATH in .env}/Bazarr/Config:/config
      - ${COMMON_PATH:?Set COMMON_PATH in .env}/Data/tvshows:/data/tvshows
      - ${COMMON_PATH:?Set COMMON_PATH in .env}/Data/movies:/data/movies

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    logging: *default_logging
    user: ${PUID:?Set PUID in .env}:${PGID:?Set PGID in .env}
    group_add:
      - ${JELLYFIN_RENDER_GID:-109}
    restart: unless-stopped
    networks:
      - media
    environment:
      TZ: ${TZ:?Set TZ in .env}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8096/health || curl -fsS http://127.0.0.1:8096 || exit 1"]
      <<: *http_healthcheck_defaults
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${COMMON_PATH:?Set COMMON_PATH in .env}/Jellyfin/Config:/config
      - ${COMMON_PATH:?Set COMMON_PATH in .env}/Jellyfin/Cache:/cache
      - ${COMMON_PATH:?Set COMMON_PATH in .env}/Data/tvshows:/data/tvshows
      - ${COMMON_PATH:?Set COMMON_PATH in .env}/Data/movies:/data/movies

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    logging: *default_logging
    restart: unless-stopped
    networks:
      - media
    dns: *service_dns
    environment:
      LOG_LEVEL: info
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      TZ: ${TZ:?Set TZ in .env}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8191 || exit 1"]
      <<: *http_healthcheck_defaults

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:v3
    container_name: jellyseerr
    init: true
    logging: *default_logging
    restart: unless-stopped
    networks:
      - media
    ports:
      - "${BIND_IP:-0.0.0.0}:${JELLYSEERR_PORT:-5055}:5055"
    depends_on:
      jellyfin:
        condition: service_healthy
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:?Set TZ in .env}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5055/api/v1/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      <<: *http_healthcheck_defaults
    volumes:
      - ${COMMON_PATH:?Set COMMON_PATH in .env}/Jellyseerr/Config:/app/config

  homarr:
    image: ghcr.io/homarr-labs/homarr:v1.73.0@sha256:72f98c87dbd556736a3f25f7d19fefa77a7e48eb76c4d7929e5535f7e3c0fdd0
    container_name: homarr
    logging: *default_logging
    restart: unless-stopped
    networks:
      - media
      - docker-api
    environment:
      PUID: ${PUID:?Set PUID in .env}
      PGID: ${PGID:?Set PGID in .env}
      TZ: ${TZ:?Set TZ in .env}
      SECRET_ENCRYPTION_KEY: ${HOMARR_SECRET_ENCRYPTION_KEY:?Set HOMARR_SECRET_ENCRYPTION_KEY in .env}
      BASE_URL: ${HOMARR_BASE_URL:?Set HOMARR_BASE_URL in .env}
      AUTH_PROVIDERS: credentials
      DOCKER_HOSTNAMES: docker-socket-proxy
      DOCKER_PORTS: "2375"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7575/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      <<: *http_healthcheck_defaults
    volumes:
      - ${COMMON_PATH:?Set COMMON_PATH in .env}/Homarr/AppData:/appdata

  glances:
    image: nicolargo/glances:4.5.4-full@sha256:4b95c50820107884574059741a1a787bfae3b499e8b003be32abc9d756084c06
    container_name: glances
    logging: *default_logging
    restart: unless-stopped
    pid: host
    networks:
      - media
    environment:
      TZ: ${TZ:?Set TZ in .env}
      GLANCES_OPT: "-w --disable-webui --disable-process --disable-plugin network -C /etc/glances.conf"
    expose:
      - "61208"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:61208/api/4/status', timeout=5)"]
      <<: *http_healthcheck_defaults
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${COMMON_PATH:?Set COMMON_PATH in .env}/Glances/glances.conf:/etc/glances.conf:ro
      - /etc/os-release:/etc/os-release:ro
      - /sys:/sys:ro
      - ${COMMON_PATH:?Set COMMON_PATH in .env}/Data:/host-data:ro

  docker-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest@sha256:5253050dd304d351df2ee61bba43c57dd2b19bb640497a679592051de3a3c639
    container_name: docker-socket-proxy
    logging: *default_logging
    restart: unless-stopped
    networks:
      - docker-api
    environment:
      CONTAINERS: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
      ALLOW_START: "0"
      ALLOW_STOP: "0"
      ALLOW_RESTARTS: "0"
    expose:
      - "2375"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/_ping | grep -qx OK"]
      <<: *http_healthcheck_defaults
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  nginx-proxy:
    image: nginx:latest
    container_name: nginx-proxy
    command:
      - /bin/sh
      - -c
      - >-
        mkdir -p /usr/share/nginx/html/assets &&
        cp -a /asset-source/. /usr/share/nginx/html/assets/ &&
        exec nginx -g 'daemon off;'
    logging: *default_logging
    restart: unless-stopped
    networks:
      - media
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - ${BIND_IP:-0.0.0.0}:${NGINX_PORT:-8090}:80
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/assets:/asset-source:ro
      - ./nginx/logs:/var/log/nginx
